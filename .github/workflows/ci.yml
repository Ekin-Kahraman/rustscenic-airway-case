name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check scripts
        run: python -m py_compile scripts/*.py
      - name: Validate committed outputs
        run: python scripts/validate_outputs.py

  pyscenic-reference-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install pinned pySCENIC reference stack
        run: |
          python -m pip install --upgrade pip
          pip install -r reference/requirements-pyscenic-aucell.txt
      - name: Compare tiny RustScenic and pySCENIC AUCell output
        run: python reference/smoke_pyscenic_reference.py
